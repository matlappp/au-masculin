<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
	<!-- Fond marbre / époxy — texture générée, aucune photo.
	     Utilisée en fond de page (styles.css → body::before). -->
	<defs>
		<!-- Nuages doux : la masse du marbre -->
		<filter id="nuage" x="0" y="0" width="100%" height="100%">
			<feTurbulence type="fractalNoise" baseFrequency="0.0035 0.0085" numOctaves="6" seed="11" result="t"/>
			<feColorMatrix in="t" type="matrix"
				values="0 0 0 0 0.82
				        0 0 0 0 0.79
				        0 0 0 0 0.73
				        0.9 0 0 0 -0.28"/>
		</filter>
		<!-- Veines : même bruit, seuil très raide -->
		<filter id="veine" x="0" y="0" width="100%" height="100%">
			<feTurbulence type="fractalNoise" baseFrequency="0.0022 0.011" numOctaves="7" seed="4" result="t"/>
			<feColorMatrix in="t" type="matrix"
				values="0 0 0 0 0.58
				        0 0 0 0 0.54
				        0 0 0 0 0.46
				        1 0 0 0 -0.47"/>
			<feComponentTransfer>
				<feFuncA type="table" tableValues="0 0 0.12 1 0.12 0 0"/>
			</feComponentTransfer>
			<feGaussianBlur stdDeviation="0.7"/>
		</filter>
		<!-- Filet or, très discret -->
		<filter id="or" x="0" y="0" width="100%" height="100%">
			<feTurbulence type="fractalNoise" baseFrequency="0.0018 0.014" numOctaves="6" seed="19" result="t"/>
			<feColorMatrix in="t" type="matrix"
				values="0 0 0 0 0.74
				        0 0 0 0 0.60
				        0 0 0 0 0.29
				        1 0 0 0 -0.60"/>
			<feComponentTransfer>
				<feFuncA type="table" tableValues="0 0 0.1 1 0.1 0"/>
			</feComponentTransfer>
			<feGaussianBlur stdDeviation="0.5"/>
		</filter>
	</defs>

	<rect width="1400" height="1400" fill="#FAF8F4"/>
	<rect width="1400" height="1400" filter="url(#nuage)" opacity=".85"/>
	<rect width="1400" height="1400" filter="url(#veine)" opacity=".72"/>
	<rect width="1400" height="1400" filter="url(#or)" opacity=".6"/>
</svg>
